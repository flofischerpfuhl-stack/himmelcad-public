stages:
  - typecheck
  - lint
  - test
  - build
  - licenses

variables:
  PNPM_HOME: '$CI_PROJECT_DIR/.pnpm-store'
  CARGO_HOME: '$CI_PROJECT_DIR/.cargo'
  CARGO_TERM_COLOR: 'always'
  RUST_BACKTRACE: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

default:
  interruptible: true

.node:
  image: node:22-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm config set store-dir "$PNPM_HOME"
    - pnpm install --frozen-lockfile --ignore-scripts
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

.rust:
  image: rust:1.88-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libclang-dev && rm -rf /var/lib/apt/lists/*
    - rustup component add rustfmt clippy
    - rustup target add wasm32-unknown-unknown
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - target/

.python:
  image: python:3.12-bookworm

node:typecheck:
  extends: .node
  stage: typecheck
  script:
    - pnpm typecheck

node:test:
  extends: .node
  stage: test
  script:
    - pnpm test

python:automation-sdk:
  extends: .python
  stage: test
  script:
    - python -m unittest discover -s sdk/python/tests

node:policy:
  extends: .node
  stage: test
  script:
    - pnpm verify:matrix:check
    - pnpm photolab:check:english-ui
    - pnpm branding:check
    - pnpm product-names:check

# Deterministic PhotoLab gates: no dataset, no GPU, no Electron runtime, no
# browser. Runs on scheduled pipelines and whenever PhotoLab UI, Electron or
# contract sources change.
photolab:gates:
  extends: .node
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - apps/photolab/**/*
        - packages/@himmelcad/ui/**/*
        - scripts/photolab-visual-regression.mjs
        - scripts/test-photolab-e2e-contracts.mjs
        - scripts/test-photolab-visual-baseline.mjs
        - scripts/lib/png-compare.mjs
        - scripts/lib/photolab-e2e-contracts.mjs
  script:
    - pnpm photolab:test:visual-baseline
    - pnpm photolab:test:e2e-contracts
    - pnpm --filter @himmelcad/photolab test

# Headless-browser layout audit plus optional pixel-baseline comparison.
# `node:22-bookworm` ships no browser, so this job stays disabled until the
# operator points PHOTOLAB_VISUAL_IMAGE at a Chrome-capable image (with
# CHROME_BIN set when the binary is not at /usr/bin/google-chrome).
# Set PHOTOLAB_VISUAL_BASELINES=compare only for an image whose Chromium build
# and font stack match apps/photolab/test/visual-baselines/manifest.json;
# otherwise the job runs the layout-invariant audit without pixel comparison.
photolab:visual:
  extends: .node
  image: $PHOTOLAB_VISUAL_IMAGE
  stage: test
  rules:
    - if: '$PHOTOLAB_VISUAL_IMAGE == null || $PHOTOLAB_VISUAL_IMAGE == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - apps/photolab/**/*
        - packages/@himmelcad/ui/**/*
        - scripts/photolab-visual-regression.mjs
        - scripts/lib/a11y-audit.mjs
        - scripts/lib/a11y-audit.test.mjs
        - scripts/lib/png-compare.mjs
        - apps/photolab/test/a11y-exceptions.json
  script:
    - node --test scripts/lib/a11y-audit.test.mjs
    - |
      if [ "$PHOTOLAB_VISUAL_BASELINES" = 'compare' ]; then
        pnpm photolab:test:visual:baselines -- --a11y
      else
        pnpm photolab:test:visual -- --a11y
      fi
  artifacts:
    when: always
    paths:
      - .build/visual-regression/
      - .build/visual-regression/a11y-report.json
      - .build/visual-regression/a11y-summary.md
    expire_in: 1 week

node:lint:
  extends: .node
  stage: lint
  script:
    - pnpm lint
    - pnpm format:check

rust:fmt:
  extends: .rust
  stage: lint
  script:
    - cargo fmt --all -- --check

rust:clippy:
  extends: .rust
  stage: lint
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

rust:himmelcap-import:
  extends: .rust
  stage: lint
  script:
    - cargo test -p himmelcad-io hcap_import --locked

rust:test:
  extends: .rust
  stage: test
  script:
    - cargo test --workspace

rust:build-sidecar:
  extends: .rust
  stage: build
  script:
    - cargo build --bin himmelcad-sidecar
  artifacts:
    paths:
      - target/debug/himmelcad-sidecar
    expire_in: 1 day

rust:build-wasm:
  extends: .rust
  stage: build
  script:
    - cargo build -p himmelcad-wasm --target wasm32-unknown-unknown

node:build:
  extends: .node
  stage: build
  script:
    - pnpm build

licenses:cargo-deny:
  extends: .rust
  stage: licenses
  script:
    - cargo install cargo-deny --locked
    - cargo deny check
