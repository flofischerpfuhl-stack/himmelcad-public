[workspace]
resolver = "2"
members = [
    "crates/himmelcad-core",
    "crates/himmelcad-decode-wasm",
    "crates/himmelcad-io",
    "crates/himmelcad-render",
    "crates/himmelcad-spatial",
    "crates/himmelcad-sidecar",
    "crates/himmelcad-wasm",
]
exclude = ["vendor/acadrust"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "BUSL-1.1"
repository = "https://gitlab.com/florian-fischer-group/himmelcad"
authors = ["HimmelCAD project"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-compat"] }
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "extensions", "extras", "allow_empty_texture"] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }
bevy_basisu_loader_sys = "0.4.4"
earcut = "0.4.10"
draco-gltf = { version = "0.1.0", default-features = false }
meshopt-rs = { version = "0.1.2", features = ["experimental"] }
nom-exif = { version = "3.6.1", default-features = false }
las = { version = "0.9", features = ["laz"] }
zip = { version = "8.6.0", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
