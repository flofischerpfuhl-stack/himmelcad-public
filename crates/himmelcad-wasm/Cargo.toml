[package]
name = "himmelcad-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASM bridge for WeltView. Same contract as the sidecar binary."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam.workspace = true
himmelcad-core = { path = "../himmelcad-core" }
himmelcad-render = { path = "../himmelcad-render" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }

[lints]
workspace = true
