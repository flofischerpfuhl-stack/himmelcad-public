[package]
name = "himmelcad-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-running HimmelCAD sidecar process. Speaks JSON-RPC 2.0 over stdio."

[[bin]]
name = "himmelcad-sidecar"
path = "src/main.rs"

[dependencies]
himmelcad-core = { path = "../himmelcad-core" }
himmelcad-io = { path = "../himmelcad-io" }
himmelcad-render = { path = "../himmelcad-render" }
himmelcad-spatial = { path = "../himmelcad-spatial" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "process", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom = "0.3.4"
hmac = "0.12.1"
zip.workspace = true
fs2 = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "tiff"] }
las.workspace = true

[dev-dependencies]
gltf.workspace = true

[lints]
workspace = true
