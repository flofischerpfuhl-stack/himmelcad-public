[package]
name = "himmelcad-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-running HimmelCAD sidecar process. Speaks JSON-RPC 2.0 over stdio."

[dependencies]
himmelcad-command = { path = "../himmelcad-command" }
himmelcad-core = { path = "../himmelcad-core" }
himmelcad-document = { path = "../himmelcad-document" }
himmelcad-domain-pointcloud = { path = "../himmelcad-domain-pointcloud" }
himmelcad-domain-registration = { path = "../himmelcad-domain-registration" }
himmelcad-io = { path = "../himmelcad-io" }
himmelcad-model = { path = "../himmelcad-model" }
himmelcad-prepared = { path = "../himmelcad-prepared" }
himmelcad-prepared-build = { path = "../himmelcad-prepared-build" }
himmelcad-process = { path = "../himmelcad-process" }
himmelcad-spatial = { path = "../himmelcad-spatial" }
himmelcad-transform = { path = "../himmelcad-transform" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "process", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom = "0.3.4"
hmac = "0.12.1"
zip.workspace = true
fs2 = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "tiff"] }
las.workspace = true

[dev-dependencies]
gltf.workspace = true
himmelcad-domain-drafting = { path = "../himmelcad-domain-drafting" }

[lints]
workspace = true
