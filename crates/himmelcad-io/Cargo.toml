[package]
name = "himmelcad-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Importers/exporters (LAS first). License-checked dependencies only."

[dependencies]
himmelcad-core = { path = "../himmelcad-core" }
himmelcad-spatial = { path = "../himmelcad-spatial" }
himmelcad-render = { path = "../himmelcad-render" }
serde.workspace = true
serde_json.workspace = true
nom-exif.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
las.workspace = true
e57 = { version = "=0.11.13", features = ["crc32c"] }
quick-xml = "=0.41.0"
dxf = { version = "=0.6.1", features = ["serialize"] }
geotiff-reader = { version = "=0.7.0", default-features = false, features = ["local"] }
tiff-reader = { version = "=0.7.0", default-features = false, features = ["jpeg", "zstd"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
ndarray = "=0.17.2"
acadrust = { path = "../../vendor/acadrust" }
zip = { workspace = true, features = ["deflate-flate2"] }
flate2 = "=1.1.9"

[dev-dependencies]
geotiff-writer = "=0.7.0"

[lints]
workspace = true
