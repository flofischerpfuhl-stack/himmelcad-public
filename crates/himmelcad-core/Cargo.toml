[package]
name = "himmelcad-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HimmelCAD authoritative core: entities, commands, project storage, contracts."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
glam.workspace = true
sha2.workspace = true
hex.workspace = true
parking_lot.workspace = true
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }

[features]
default = []
ts-bindings = ["dep:ts-rs"]

[[bin]]
name = "generate_entity_bindings"
path = "src/bin/generate_entity_bindings.rs"
required-features = ["ts-bindings"]

[lints]
workspace = true
