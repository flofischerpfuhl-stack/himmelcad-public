[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "BUSL-1.1",
    "OpenSSL",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
deny = []

[advisories]
yanked = "warn"
# These are maintenance-status advisories, not known vulnerabilities. Their
# narrow, time-bounded exceptions and replacement triggers are reviewed in
# docs/security/advisory-exceptions.md.
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2024-0436"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
