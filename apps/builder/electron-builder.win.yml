appId: de.himmelcad.builder
productName: HimmelCAD Builder
artifactName: HimmelCAD-Builder-${version}-${arch}.${ext}
directories:
  output: release
publish:
  provider: github
  owner: flofischerpfuhl-stack
  repo: himmelcad-public
  channel: builder
  releaseType: release
files:
  - dist/electron/**
  - dist/renderer/**
  - build/icon.ico
  - build/icon.png
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../LICENSES/THIRD_PARTY.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../target/x86_64-pc-windows-gnullvm/release/himmelcad-sidecar.exe
    to: himmelcad-sidecar.exe
  - from: ../../.build/automation-runtime/win32-x64
    to: automation-runtime/win32-x64
  - from: ../../vendor/potreeconverter/win32-x64
    to: vendor/potreeconverter/win32-x64
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  executableName: himmelcad-builder
portable:
  artifactName: HimmelCAD-Builder-${version}-${arch}-portable.${ext}
nsis:
  artifactName: HimmelCAD-Builder-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
