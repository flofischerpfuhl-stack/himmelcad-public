name: himmel_cap
description: HimmelCAD Cap — field capture for PhotoLab (.hcap)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  path: ^1.9.0
  archive: ^3.6.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.2
  provider: ^6.1.2
  collection: ^1.18.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: HCWordmark
      fonts:
        - asset: assets/fonts/Kamikaze.ttf
