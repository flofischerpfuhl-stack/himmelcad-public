appId: de.himmelcad.photolab
productName: HimmelCAD PhotoLab
directories:
  output: release
publish:
  provider: github
  owner: flofischerpfuhl-stack
  repo: himmelcad-public
  channel: photolab
  releaseType: release
files:
  - dist/electron/**
  - dist/renderer/**
  - build/icon.ico
  - build/icon.png
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../LICENSES/THIRD_PARTY.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../.build/release-inventory/photolab-win32-x64.json
    to: RELEASE_INVENTORY.json
  - from: ../../target/x86_64-pc-windows-gnullvm/release/himmelcad-sidecar.exe
    to: himmelcad-sidecar.exe
  - from: ../../.build/automation-runtime/win32-x64
    to: automation-runtime/win32-x64
  - from: ../../target/x86_64-pc-windows-gnullvm/release/himmelcad-portable-mvs.exe
    to: himmelcad-portable-mvs.exe
  - from: ../../target/x86_64-pc-windows-gnullvm/release/libunwind.dll
    to: libunwind.dll
  - from: ../../.build/photolab-runtime/win32-x64/workers/colmap
    to: vendor/colmap/win32-x64
  - from: ../../vendor/brush/win32-x64
    to: vendor/brush/win32-x64
  - from: ../../vendor/potreeconverter/win32-x64
    to: vendor/potreeconverter/win32-x64
  - from: ../../vendor/photolab-models
    to: vendor/photolab-models
  - from: ../../.build/photolab-runtime/win32-x64/workers/dedode
    to: vendor/dedode/win32-x64
  - from: ../../.build/photolab-runtime/win32-x64/workers/geo
    to: workers/geo
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  executableName: himmelcad-photolab
portable:
  artifactName: HimmelCAD-PhotoLab-${version}-${arch}-portable.${ext}
nsis:
  artifactName: HimmelCAD-PhotoLab-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
